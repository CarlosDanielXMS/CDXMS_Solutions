name: One-time JUIF export patch

on:
  push:
    branches:
      - integration/juif-json-boundary

permissions:
  contents: write

jobs:
  patch-export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/juif-json-boundary
          fetch-depth: 0

      - name: Apply JUIF export migration
        run: python .github/scripts/one_time_patch_juif_export.py

      - name: Validate JUIF capability
        run: python src/capabilities/juif_ui_builder/scripts/validate_juif_ui_builder_incremental.py

      - name: Commit migrated export
        shell: bash
        run: |
          if git diff --quiet -- src/capabilities/juif_ui_builder/macrodroid/'[CDXMS]_JUIF_UI_Builder.ablock'; then
            echo 'Export already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/capabilities/juif_ui_builder/macrodroid/'[CDXMS]_JUIF_UI_Builder.ablock'
          git commit -m 'fix(juif): harden JSON boundary in MacroDroid export'
          git push origin HEAD:integration/juif-json-boundary
